apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-one-name
  labels:
    app: app-one-label
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-one
  template:
    metadata:
      labels:
        app: app-one
    spec:
      containers:
      - name: app-one
        image: paulbouwer/hello-kubernetes:1.10
        env:
        - name: MESSAGE
          value: "Hello from app1."
        ports:
        - containerPort: 8080
---
